<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kampdag">
  <title>Dagens kamp</title>
  <link rel="manifest" href="dagens-kamp-manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="kampdag-icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="kampdag-icon-180.png">
  <link rel="stylesheet" href="dagens-kamp.css?v=20260817-7">
</head>
<body>
  <main class="matchday-shell">
    <header class="matchday-header">
      <div class="matchday-mark" aria-hidden="true">
        <img class="matchday-app-icon" src="kampdag-icon-192.png" alt="">
      </div>
      <div>
        <div class="matchday-eyebrow">
          <span class="live-dot"></span>
          Kampdag
        </div>
        <h1>Dagens kamp</h1>
        <p>Rett inn i kampregistreringen.</p>
      </div>
    </header>

    <section id="loginBox" class="login-card">
      <div class="card-kicker">Trenerinnlogging</div>
      <h2>Velkommen tilbake</h2>
      <p>Logg inn én gang, så husker telefonen deg.</p>

      <label for="email">E-post</label>
      <input type="email" id="email" autocomplete="username" placeholder="navn@epost.no">

      <label for="password">Passord</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="Passord">

      <button id="loginBtn" type="button">Logg inn</button>
      <p id="loginError" role="alert"></p>
    </section>

    <section id="app" class="matchday-app" hidden>
      <div class="app-toolbar">
        <span class="signed-in-state"><span></span>Klar for kamp</span>
        <button id="logoutBtn" class="logout-button" type="button">Logg ut</button>
      </div>

      <div id="status" class="status-message" aria-live="polite">Laster dagens kamp …</div>
      <div id="matchList" class="match-list"></div>

      <a class="overview-link" href="oversikt.html">
        <span aria-hidden="true">←</span>
        Til oversikten
      </a>
    </section>
  </main>

  <script type="module" src="dagens-kamp.js?v=20260817-7"></script>
</body>
</html>
