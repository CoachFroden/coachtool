name: Check playing time fix

on:
  push:
    branches:
      - fix/playing-time-registration

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check app.js syntax
        run: node --check app.js
