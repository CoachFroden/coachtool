<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trener</title>
  <link rel="stylesheet" href="login.css" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Coach" />
  <link rel="apple-touch-icon" href="icon-192.png" />
</head>

<body>
  <main class="coach-container">

    <h1 id="authTitle">Trener</h1>
    <p id="authSubtitle" class="coach-sub">Logg inn for å fortsette</p>

    <div class="coach-card">

      <input
        type="email"
        id="email"
        placeholder="E-post"
        class="login-input"
        autocomplete="email"
      />

      <input
        type="password"
        id="password"
        placeholder="Passord"
        class="login-input"
        autocomplete="current-password"
      />

      <!-- Kun brukt ved registrering -->
      <input
        type="password"
        id="password2"
        placeholder="Gjenta passord"
        class="login-input"
        autocomplete="new-password"
        hidden
      />

      <button id="loginBtn" class="logout-btn primary-action">
        Logg inn
      </button>

      <button id="registerBtn" class="auth-mode-btn" type="button">
        Opprett ny bruker
      </button>

      <button id="backToLoginBtn" class="auth-mode-btn" type="button" hidden>
        Tilbake til innlogging
      </button>

      <button id="resendVerifyBtn" class="logout-btn resend-button" type="button" hidden>
        Send verifiseringsmail på nytt
      </button>

      <p id="errorMsg" role="alert"></p>
      <p id="infoMsg" role="status"></p>

    </div>

  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
