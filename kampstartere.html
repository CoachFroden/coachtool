<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kampstartere · Coach</title>
  <meta name="theme-color" content="#07111d">
  <link rel="stylesheet" href="kampstartere.css?v=20260907-1">
</head>
<body>
  <header class="pageHeader">
    <button class="backButton" type="button" aria-label="Tilbake til forsiden" onclick="window.location.href='fremside.html'">←</button>
    <div class="headerText">
      <span class="eyebrow">KAMPADMINISTRASJON</span>
      <h1>Kampstartere</h1>
      <p id="userLine">Laster…</p>
    </div>
    <button id="logoutBtn" class="logoutButton" type="button">Logg ut</button>
  </header>

  <main class="pageShell">
    <section class="introCard" aria-labelledby="introHeading">
      <div>
        <span class="introIcon" aria-hidden="true">👥</span>
        <div>
          <span class="sectionKicker">SAMLET OVERSIKT</span>
          <h2 id="introHeading">Hvem startet kampene?</h2>
          <p>Se hvem som satte i gang hver kamp, og når det skjedde.</p>
        </div>
      </div>
    </section>

    <section class="statsGrid" aria-label="Nøkkeltall">
      <article class="statCard">
        <span>Startede kamper</span>
        <strong id="matchTotal">–</strong>
      </article>
      <article class="statCard">
        <span>Registrerte startere</span>
        <strong id="starterTotal">–</strong>
      </article>
      <article class="statCard warningStat">
        <span>Mangler starter</span>
        <strong id="unknownTotal">–</strong>
      </article>
    </section>

    <section class="summarySection" aria-labelledby="summaryHeading">
      <div class="sectionHeading">
        <div>
          <span class="sectionKicker">FORDELING</span>
          <h2 id="summaryHeading">Kamper per trener</h2>
        </div>
      </div>
      <div id="starterSummary" class="starterSummary">
        <div class="loadingRow">Laster oversikt…</div>
      </div>
    </section>

    <section class="matchesSection" aria-labelledby="matchesHeading">
      <div class="sectionHeading listHeading">
        <div>
          <span class="sectionKicker">KAMP FOR KAMP</span>
          <h2 id="matchesHeading">Alle startede kamper</h2>
        </div>
        <span id="visibleCount" class="visibleCount"></span>
      </div>

      <div class="controls">
        <label for="starterFilter">Vis kamper startet av</label>
        <div class="controlRow">
          <select id="starterFilter" disabled>
            <option value="all">Alle</option>
          </select>
          <button id="refreshBtn" class="refreshButton" type="button" disabled>Oppdater</button>
        </div>
      </div>

      <div id="matchList" class="matchList" aria-live="polite">
        <div class="stateCard">
          <span class="spinner" aria-hidden="true"></span>
          <strong>Laster kamper…</strong>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="kampstartere.js?v=20260907-1"></script>
</body>
</html>
