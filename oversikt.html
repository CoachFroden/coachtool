<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Coach | Oversikt</title>
  <link rel="stylesheet" href="oversikt.css?v=20260829-3" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#07111f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Coach" />
  <link rel="apple-touch-icon" href="icon-192.png" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="kicker">SAMNANGER G14</p>
        <h1>Coach</h1>
        <span id="userLine" class="userLine"></span>
      </div>
      <div class="topActions">
        <button id="coachOnlyBtn" class="iconBtn" type="button" hidden aria-label="Dashboard">⌂</button>
        <button id="logoutBtn" class="iconBtn" type="button" aria-label="Logg ut">↗</button>
      </div>
    </header>

    <section class="nextCard">
      <div class="nextHead">
        <span class="label">NESTE KAMP</span>
        <span id="nextCountdown" class="countdown"></span>
      </div>
      <h2 id="nextOpponent">Laster kamp…</h2>
      <p id="nextMeta" class="matchMeta">Henter kampinformasjon</p>
      <p id="nextVenue" class="venue"></p>
      <div class="primaryActions">
        <button id="lineupBtn" class="btn secondary" type="button">Lagoppstilling</button>
        <button id="startMatchBtn" class="btn primary" type="button">Start kamp</button>
      </div>
    </section>

    <section class="sectionBlock">
      <div class="sectionHeader">
        <div><span class="label">PLAN</span><h2>Kommende kamper</h2></div>
        <button id="allMatchesBtn" class="textBtn" type="button">Alle kamper ›</button>
      </div>
      <div id="upcomingList" class="matchList"><div class="skeletonRow"></div><div class="skeletonRow"></div></div>
    </section>

    <section class="sectionBlock">
      <div class="sectionHeader">
        <div><span class="label">SIST SPILT</span><h2>Siste kamp</h2></div>
      </div>
      <div id="lastMatch"><div class="skeletonCard"></div></div>
    </section>

    <section class="quickLinks">
      <button id="statsBtn" class="quickCard" type="button"><span>▥</span><div><strong>Statistikk</strong><small>Kamper og spillere</small></div><b>›</b></button>
      <button class="quickCard" type="button" onclick="window.location.href='kamper.html'"><span>⚽</span><div><strong>Kamper</strong><small>Planlegg og rediger</small></div><b>›</b></button>
    </section>

    <p id="errorMsg" class="error"></p>
  </main>
  <script type="module" src="oversikt-home.js?v=20260829-1"></script>
</body>
</html>
